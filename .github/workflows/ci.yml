name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # The Go c4 CLI that test_matches_go_cli_byte_for_byte compares
      # against. Pinned to a c4 commit: bump it deliberately, and expect
      # that test to tell you whether c4py still matches.
      - name: Install the c4 CLI (c4 5ee54b6)
        run: |
          go install github.com/Avalanche-io/c4/cmd/c4@5ee54b6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "C4_BIN=$(go env GOPATH)/bin/c4" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - run: python -m pytest --junitxml=junit.xml
      - name: Skips the allow-list names
        if: success() || failure()
        run: python scripts/check_skips.py junit.xml --allow tests/allowed-skips.txt
